<style>
:root {

* { box-sizing: border-box; }
html, body { height: 100%; }
body {

}
.brand:hover .brand-mark { transform: rotate(-8deg) scale(1.05); background: var(--accent); }

main { flex: 1; position: relative; display: flex; align-items: center; isolation: isolate; padding: 32px 0 64px; }
main::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background-image: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 14%, transparent) 1px, transparent 0);
  background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 60% 40%, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 60% at 60% 40%, #000 20%, transparent 75%);
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px;

}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.code {

}
.code span { display: inline-block; animation: rise 1s var(--ease) both; }
.code .accent { color: var(--accent); }
@keyframes rise { from { transform: translateY(105%); } to { transform: none; } }
h1 { margin: 24px 0 0; font-family: var(--display); font-variation-settings: "wdth" 85; font-size: clamp(1.75rem, 4vw, 2.75rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
p.lede { margin: 12px 0 0; color: var(--muted); max-width: 46ch; font-size: 1.1rem; }
.path { font-family: var(--mono); font-size: .95em; color: var(--ink); background: var(--accent-wash); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
.actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
.btn {

  font-weight: 500; text-decoration: none; border: 1px solid var(--ink); font-size: 15px;
  transition: transform .25s var(--ease), background .25s, border-color .25s, box-shadow .25s;
}
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 24px -10px var(--accent); }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-ghost:hover { border-color: var(--ink); background: var(--surface); transform: translateY(-2px); }
footer { padding: 28px 0 36px; color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
